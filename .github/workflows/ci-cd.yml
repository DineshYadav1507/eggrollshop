name: EggRoll Shop CI/CD
on:
  push:
    branches: [main]
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/eggrollshop-backend:${{ github.sha }} -t ${{ secrets.DOCKER_USERNAME }}/eggrollshop-backend:latest ./backend
      - name: Build frontend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/eggrollshop-frontend:${{ github.sha }} -t ${{ secrets.DOCKER_USERNAME }}/eggrollshop-frontend:latest ./frontend
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/eggrollshop-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/eggrollshop-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/eggrollshop-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/eggrollshop-frontend:latest
  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/eggrollshop
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
