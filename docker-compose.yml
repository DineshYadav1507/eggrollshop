services:
  nginx:
    image: nginx:alpine
    container_name: eggrollshop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    image: DineshYadav1507/eggrollshop-frontend:latest
    container_name: eggrollshop-frontend
    restart: unless-stopped

  backend:
    image: DineshYadav1507/eggrollshop-backend:latest
    container_name: eggrollshop-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: eggrollshop
      DB_USER: eggrolluser
      DB_PASSWORD: ${DB_PASSWORD:-eggrollpass}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: eggrollshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eggrollshop
      MYSQL_USER: eggrolluser
      MYSQL_PASSWORD: ${DB_PASSWORD:-eggrollpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
